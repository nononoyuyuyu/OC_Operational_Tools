<!DOCTYPE html>
<html lang="ja">
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title><?= toolName ?> - コピー確認</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: #202124;
        font-size: 14px;
        line-height: 1.6;
      }

      main {
        padding: 24px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 20px;
        line-height: 1.4;
      }

      p {
        margin: 0 0 12px;
      }

      .summary {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 6px 16px;
        margin: 16px 0;
        padding: 12px 16px;
        border: 1px solid #dadce0;
        border-radius: 8px;
        background: #f8f9fa;
      }

      .summary dt {
        font-weight: 700;
      }

      .summary dd {
        margin: 0;
      }

      .date-list {
        max-height: 210px;
        overflow: auto;
        margin: 8px 0 16px;
        padding: 8px 8px 8px 34px;
        border: 1px solid #dadce0;
        border-radius: 8px;
        background: #ffffff;
      }

      .date-list li {
        padding: 2px 0;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 20px;
      }

      button {
        min-width: 88px;
        min-height: 38px;
        padding: 8px 18px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background: #ffffff;
        color: #202124;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
      }

      button:hover:not(:disabled) {
        background: #f1f3f4;
      }

      button:focus-visible {
        outline: 3px solid rgba(26, 115, 232, 0.35);
        outline-offset: 2px;
      }

      button.primary {
        border-color: #1a73e8;
        background: #1a73e8;
        color: #ffffff;
      }

      button.primary:hover:not(:disabled) {
        background: #1765cc;
      }

      button:disabled {
        cursor: default;
        opacity: 0.6;
      }

      .status {
        min-height: 24px;
        margin-top: 16px;
        font-weight: 700;
      }

      .status.success {
        color: #137333;
      }

      .status.error {
        color: #b3261e;
      }

      .manual-panel {
        margin-top: 16px;
        padding: 14px;
        border: 1px solid #f9ab00;
        border-radius: 8px;
        background: #fef7e0;
      }

      .clipboard-source-offscreen {
        position: fixed;
        left: -10000px;
        top: 0;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      .clipboard-source-manual {
        display: block;
        width: 100%;
        min-height: 180px;
        margin-top: 10px;
        padding: 10px;
        border: 1px solid #9aa0a6;
        border-radius: 4px;
        resize: vertical;
        background: #ffffff;
        color: #202124;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.4;
        white-space: pre;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>コピー内容の確認</h1>
      <p>以下のデータをクリップボードにコピーします。</p>

      <dl class="summary">
        <dt>検出ヘッダー行</dt>
        <dd><?= headerRow ?>行目</dd>
        <dt>取得行数</dt>
        <dd><?= rowCount ?>行</dd>
        <dt>日付列数</dt>
        <dd><?= dateLabels.length ?>列</dd>
      </dl>

      <p><strong>取得対象の日付列</strong></p>
      <ol class="date-list" aria-label="取得対象の日付列一覧">
        <? for (let index = 0; index < dateLabels.length; index += 1) { ?>
          <li><?= dateLabels[index] ?></li>
        <? } ?>
      </ol>

      <p>列名の行とセルの書式はコピーされません。コピーしますか。</p>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <section id="manualPanel" class="manual-panel" hidden>
        <strong>自動コピーに失敗しました。</strong>
        <p id="manualInstruction">下のデータを選択したまま、キーボードでコピーしてください。</p>
      </section>

      <textarea
        id="copySource"
        class="clipboard-source-offscreen"
        readonly
        aria-label="コピー対象データ"
        aria-hidden="true"
        tabindex="-1"
        spellcheck="false"
      ><?= copyText ?></textarea>

      <div class="actions">
        <button id="noButton" type="button">いいえ</button>
        <button id="yesButton" class="primary" type="button">はい</button>
        <button id="closeButton" type="button" hidden>閉じる</button>
      </div>
    </main>

    <script>
      'use strict';

      const copySource = document.getElementById('copySource');
      const status = document.getElementById('status');
      const manualPanel = document.getElementById('manualPanel');
      const manualInstruction = document.getElementById('manualInstruction');
      const yesButton = document.getElementById('yesButton');
      const noButton = document.getElementById('noButton');
      const closeButton = document.getElementById('closeButton');

      noButton.addEventListener('click', closeDialog);
      closeButton.addEventListener('click', closeDialog);
      yesButton.addEventListener('click', copyToClipboard);

      function closeDialog() {
        google.script.host.close();
      }

      function copyToClipboard() {
        if (yesButton.disabled) {
          return;
        }

        yesButton.disabled = true;
        noButton.disabled = true;
        setStatus('クリップボードへコピーしています。', '');

        let clipboardPromise = null;
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          try {
            // Safariの利用者操作要件を満たすため、クリックイベント直下で呼び出す。
            clipboardPromise = navigator.clipboard.writeText(copySource.value);
          } catch (error) {
            clipboardPromise = null;
          }
        }

        // Clipboard APIのPromiseが後で拒否された場合、利用者操作状態は
        // 既に失われている可能性がある。そのため互換コピーも同じクリック
        // ハンドラー内で同期的に試行する。両方が成功しても同一本文である。
        const legacySucceeded = tryLegacyCopy();
        if (legacySucceeded) {
          if (clipboardPromise && typeof clipboardPromise.catch === 'function') {
            clipboardPromise.catch(function () {
              // 同一本文の互換コピーが成功済みのため、拒否を処理済みにする。
            });
          }
          showSuccess();
          return;
        }

        if (clipboardPromise && typeof clipboardPromise.then === 'function') {
          clipboardPromise.then(showSuccess, showManualCopy);
          return;
        }

        showManualCopy();
      }

      function tryLegacyCopy() {
        try {
          copySource.focus();
          copySource.select();
          copySource.setSelectionRange(0, copySource.value.length);
          return document.execCommand('copy');
        } catch (error) {
          return false;
        }
      }

      function showSuccess() {
        setStatus('クリップボードにコピーしました。', 'success');
        yesButton.hidden = true;
        noButton.hidden = true;
        closeButton.hidden = false;
        closeButton.focus();
      }

      function showManualCopy() {
        const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent);
        const shortcut = isMac ? 'Command+C' : 'Ctrl+C';

        manualInstruction.textContent =
          '下のデータは全選択されています。' + shortcut + 'でコピーしてください。';
        manualPanel.hidden = false;
        copySource.className = 'clipboard-source-manual';
        copySource.removeAttribute('aria-hidden');
        copySource.removeAttribute('tabindex');
        copySource.focus();
        copySource.select();
        copySource.setSelectionRange(0, copySource.value.length);

        setStatus(
          'ブラウザが自動コピーを許可しませんでした。手動でコピーしてください。',
          'error',
        );

        yesButton.hidden = true;
        noButton.hidden = true;
        closeButton.hidden = false;
      }

      function setStatus(message, type) {
        status.textContent = message;
        status.className = 'status' + (type ? ' ' + type : '');
      }
    </script>
  </body>
</html>
