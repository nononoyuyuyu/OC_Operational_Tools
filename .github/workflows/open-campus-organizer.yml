name: Open Campus Organizerの検証

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: open-campus-organizer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: 変更範囲・配布番号
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.plan.outputs.test }}
      build: ${{ steps.plan.outputs.build }}
      matrix: ${{ steps.plan.outputs.matrix }}
      native_android: ${{ steps.plan.outputs.native_android }}
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      web: ${{ steps.plan.outputs.web }}
      benchmark: ${{ steps.plan.outputs.benchmark }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 Tests/OpenCampusOrganizer/ci_release_test.py
      - run: bash .github/scripts/lint_workflows.sh
      - id: plan
        run: python3 .github/scripts/oco_ci.py

  test:
    name: 解析・自動テスト
    needs: plan
    if: needs.plan.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Source/OpenCampusOrganizer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - id: dependencies
        run: flutter pub get --enforce-lockfile
      - name: Dartフォーマット検証（修正差分を表示）
        run: |
          dart format lib tool ../../Tests/OpenCampusOrganizer
          git diff --exit-code -- lib tool ../../Tests/OpenCampusOrganizer
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter analyze --no-pub
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter test --no-pub ../../Tests/OpenCampusOrganizer
      - name: CSVの同一出力・別プロセスメモリ計測
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && needs.plan.outputs.benchmark == 'true' }}
        run: dart run tool/csv_benchmark.dart
      - if: needs.plan.outputs.web == 'true'
        run: flutter build web --no-pub --no-web-resources-cdn

  build:
    name: ${{ matrix.target }}ビルド
    needs: [plan, test]
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    environment: ${{ needs.plan.outputs.release == 'true' && 'release' || 'validation' }}
    env:
      PUB_CACHE: ${{ github.workspace }}/.oco-pub-cache
      PYTHONUTF8: '1'
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Source/OpenCampusOrganizer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Androidの依存関係をキャッシュ
        if: matrix.target == 'Android'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('Source/OpenCampusOrganizer/android/**/*.gradle.kts', 'Source/OpenCampusOrganizer/android/gradle/wrapper/gradle-wrapper.properties', 'Source/OpenCampusOrganizer/pubspec.lock') }}
      - name: Androidテスト用SDKの場所を確認
        if: matrix.target == 'Android' && needs.plan.outputs.native_android == 'true'
        id: android_sdk
        run: echo "root=$ANDROID_HOME" >> "$GITHUB_OUTPUT"
      - name: Androidテスト用システムイメージをキャッシュ
        if: matrix.target == 'Android' && needs.plan.outputs.native_android == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.android_sdk.outputs.root }}/system-images/android-35
          key: android-api35-google-apis-x86_64-v1
      - name: APK出力レイアウトとPowerShell構文の検証
        if: matrix.target == 'Windows'
        shell: pwsh
        run: |
          ../../Tests/OpenCampusOrganizer/android_release_layout_test.ps1
          ../../Tests/OpenCampusOrganizer/icon_assets_test.ps1
      - name: Windowsインストーラー作成環境の準備
        if: matrix.target == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $setup
          if ((Get-FileHash $setup).Hash -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') { throw 'Inno Setupのハッシュ不一致' }
          $signature = Get-AuthenticodeSignature $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B.V.') { throw 'Inno Setupの署名不一致' }
          $installPath = Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 7'
          $process = Start-Process $setup -ArgumentList @('/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', '/TASKS=""', ('/DIR="' + $installPath + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setupの導入失敗' }
      - if: matrix.target == 'Windows'
        run: ./tool/build_windows_installer.ps1
      - if: matrix.target == 'iOS'
        run: flutter build ios --simulator --no-codesign --no-pub
      - if: matrix.target == 'Android' && (needs.plan.outputs.release != 'true' || needs.plan.outputs.native_android == 'true')
        run: flutter build apk --debug --split-per-abi --no-pub
      - name: Windowsのテーマアイコンを実ウィンドウで検証
        if: matrix.target == 'Windows'
        shell: pwsh
        run: |
          cmake --build build/windows/x64 --config Release --target oco_appearance_test
          if ($LASTEXITCODE -ne 0) { throw '外観テストのビルド失敗' }
          $env:PATH = "$((Resolve-Path 'windows/flutter/ephemeral').Path);$env:PATH"
          & build/windows/x64/appearance_test/Release/oco_appearance_test.exe
          if ($LASTEXITCODE -ne 0) { throw '外観テスト失敗' }
      - name: CPU別APKのビルド番号とABIを検証
        if: matrix.target == 'Android' && (needs.plan.outputs.release != 'true' || needs.plan.outputs.native_android == 'true')
        run: python3 ../../Tests/OpenCampusOrganizer/android_apk_version_test.py
      - name: Androidの起動・テーマ切替・画面復帰を実機相当で検証
        if: matrix.target == 'Android' && needs.plan.outputs.native_android == 'true'
        shell: bash
        run: bash ../../.github/scripts/test_android_lifecycle.sh
      - name: Windowsの導入・更新・削除を検証
        if: matrix.target == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem '../../artifacts/release/*/*-windows-x64-setup.exe')
          if ($installers.Count -ne 1) { throw 'インストーラーが一意ではありません。' }
          & ../../Tests/OpenCampusOrganizer/windows_installer_test.ps1 -Installer $installers[0].FullName
      - name: Windowsインストーラーを保存
        if: matrix.target == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OpenCampusOrganizer-windows-installer
          path: artifacts/release/*/*-windows-x64-setup.exe
          if-no-files-found: error
      - name: Windowsの配布ペイロードを検査
        if: matrix.target == 'Windows'
        run: python ../../.github/scripts/audit_payload.py build/windows/x64/runner/Release
      - name: Windowsの設定・履歴の引き継ぎと削除を検証
        if: matrix.target == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testRoot = [IO.Path]::GetFullPath('../../artifacts/userdata-ci')
          $testOutput = [IO.Path]::GetFullPath('../../artifacts/userdata-ci-installer')
          & ./tool/build_windows_installer.ps1 -UserDataTestRoot $testRoot -OutputDirectory $testOutput
          & ../../Tests/OpenCampusOrganizer/windows_userdata_test.ps1 -Installer (Join-Path $testOutput 'OpenCampusOrganizer-userdata-test-setup.exe')
      - name: Android配布APKを署名して検証
        if: matrix.target == 'Android' && needs.plan.outputs.release == 'true'
        env:
          OCO_ANDROID_KEYSTORE_BASE64: ${{ secrets.OCO_ANDROID_KEYSTORE_BASE64 }}
          OCO_ANDROID_STORE_PASSWORD: ${{ secrets.OCO_ANDROID_STORE_PASSWORD }}
          OCO_ANDROID_KEY_ALIAS: open-campus-organizer
        run: python3 ../../.github/scripts/build_android_ci.py
      - name: 署名情報のないAndroid Releaseを拒否
        if: matrix.target == 'Android'
        shell: bash
        run: |
          set +e
          (cd android && ./gradlew :app:preReleaseBuild --console=plain) > "$RUNNER_TEMP/oco-signing-check.log" 2>&1
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo '署名情報のないReleaseを拒否できませんでした。'
            exit 1
          fi
          grep -q 'OCO_RELEASE_SIGNING_REQUIRED' "$RUNNER_TEMP/oco-signing-check.log"
      - name: Android配布APKを保存
        if: matrix.target == 'Android' && needs.plan.outputs.release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OpenCampusOrganizer-android-release
          path: artifacts/android-release/*.apk
          if-no-files-found: error

  gate:
    name: OCO検証
    needs: [plan, test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          NEED_TEST: ${{ needs.plan.outputs.test }}
          NEED_BUILD: ${{ needs.plan.outputs.build }}
        run: |
          test "$PLAN" = success
          if [ "$NEED_TEST" = true ]; then test "$TEST" = success; else test "$TEST" = skipped; fi
          if [ "$NEED_BUILD" = true ]; then test "$BUILD" = success; else test "$BUILD" = skipped; fi

  publish:
    name: Release公開
    needs: [plan, gate]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: この実行で検証した配布物を取得
        run: |
          gh run download "$GITHUB_RUN_ID" -n OpenCampusOrganizer-windows-installer -D dist
          gh run download "$GITHUB_RUN_ID" -n OpenCampusOrganizer-android-release -D dist
      - name: 添付ファイルの照合後に公開
        run: python3 .github/scripts/publish_release.py
